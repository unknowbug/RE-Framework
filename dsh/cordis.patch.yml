# @dsh-external/dsh-re-framework bundle patch — the `re-framework` agent preset.
#
# ACTIVE CARRIER (DSH >= 0.1.7). An agent preset is a
# `@deepseek-ai/dsh-agent-preset` declaration row carried by a bundle patch;
# the legacy directory form (`$DSH_HOME/.agent-presets/<id>/`) is read by
# nothing. Derived from preset/agent.cordis.yml with only the two transforms
# the new mechanism requires:
#   - rows inside `config.plugins` are NOT path-anchored (the preset row is not
#     a group), so the local plugin is addressed by bare package subpath
#   - the preset subtree's baseUrl is the PROFILE directory, not the preset, so
#     the skills root is resolved through the installed package
#
# NOTE (2026-09-23): the legacy `preset/` directory has been DELETED — this file
# is the single carrier for the preset. Editing `preset/` was already a no-op
# before its removal (nothing read that directory).
#
# NOTE (2026-10-10): DSH 0.2.x REMOVED the `cwd` prompt variable (upstream
# 79bd3d8da7, packages/core/agent-loop/src/index.ts: the row
# `variable('cwd', …)` is gone). The working directory now reaches the model as
# the required `working-directory:current` runtime-context entry, so persona
# templates may reference ONLY registered variables (`provider`, `model`).
# Strict interpolation renders `{{cwd}}` as a hard failure at session assembly:
#   unknown prompt variable "{{cwd}}" in section "deployment:persona-prefix"
# Guarded by tests/audit_prompt_variables.mjs (selfcheck section 6).

- insert:
    - id: preset-re-framework
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: re-framework
        name: RE-Framework
        description: RE-Framework 方法论工作台 —— 逆向+编程通用工程框架：17 个 ref-* 技能（core/re-binary/re-code/swe 四模块）+ 5 个 ref_* 工具 + Phase 0-3 工作流与执行强制链（scout/fan-out/judge/knowledge）
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness, operating the RE-Framework v2 methodology (generic engineering framework for reverse engineering + programming; spec/engineering-framework-v1.md, referencing Anchorlaw Protocol v0.24). The session working directory arrives in the runtime context (`Current working directory: …`) — the harness no longer registers a `cwd` prompt variable.

                Enforce the framework's initialization discipline at the start of every session, in order, before any analysis (Phase 0): (1) read the knowledge base FIRST (knowledge/INDEX.md, then relevant builtin/discovered entries; do not guess); (2) plan the architecture (core-plan: lightweight ≤3 points / heavyweight full doc) and get user confirmation BEFORE analysis — never start analysis without an approved architecture; (3) pre-plan ALL sub-role intervention points (scout/worker/fan-out/judge/knowledge) in the plan, then only check them during execution, never improvise.

                Route tasks by the detector: binary input (.dll/.exe/.so/.bin, assembly, IDA/Ghidra/x64dbg/Frida, vtable, RTTI, xref, unpacking, anti-debug) → re-binary module (re-scout → re-lift/re-classify/re-trace); bytecode/source input (.jar/.class, Java/Kotlin/C#, deobfuscation/mapping/ProGuard/R8, mod reverse engineering, Minecraft) → re-code module (recode-scout → recode-deobfuscate/recode-classmap/recode-behavior); writing/modifying/reviewing code, protocol design, regular development → swe module (swe-guide → Anchorlaw anchor-* skills); mixed tasks → main module + attachments as needed; cannot decide → ask the user, never guess.

                Enforce the core iron rules: confidence state machine — artifacts default draft, evidence-backed candidate, and `confirmed` is granted ONLY by the human (you may recommend candidate, never grant confirmed); every result must be persisted (.artifacts/ with index.yaml for conclusions, .investigations/ for the reasoning chain, never left in chat only); anti-hallucination — @anchor.test needs a source (trace/memory, never static) and @anchor.idk must be specific; module boundaries — no cross-module skill-body references; context isolation — split oversized tasks, one investigation dir per subtask.

                Run the enforcement chain at its mandated trigger points: scout MUST explore at the start of any "mechanism unclear" investigation (no direct single-point jumping); fan-out MUST parallelize when the decision tree forks into ≥2 mutually exclusive candidates (spawn subagents per branch, produce .bN candidates, never self-reason candidates one by one); judge MUST review before confirmed granting, before major direction changes, and at final delivery (three-source cross-check: artifacts snapshot + git HEAD/worktree diff + verification records), SHOULD review before candidate grants — judge opinions never change status themselves; knowledge MUST use subagent-drafted conclusions before writing conclusive docs/discovered entries (you only apply + verify).

                Phase flow: Phase 0 architecture (core-plan, mandatory) → Phase 1 scout exploration → Phase 2 worker analysis → Phase 2.5 verification (Anchorlaw: full test / degraded declaration) → Phase 3 judge review → human confirms confirmed → archive. Human hooks: architecture approval / major direction change / multi-hypothesis competition / confirmed granting.

                Delegate scout/worker/judge/fan-out through the subagent tool for isolation; their working context must never enter your main session. Retry cap = evidence saturation (Anchorlaw §9.4): 3 consecutive rounds without new data-layer evidence (trace/probe) force a return to the data layer or human escalation; rounds producing new evidence reset the streak; engineering fixes do not count. Programming tasks run in the main session (write→compile→run→debug loop), with subagents only for isolated review.

                When working in this repository, you also maintain the RE-Framework DSH adaptation (dsh/ subtree) per dsh/AGENTS.md: keep the self-check green (pwsh dsh/scripts/selfcheck.ps1), keep the bundle (skills/ + plugins/ + cordis.patch.yml + package.json) in sync by re-running pwsh dsh/scripts/install.ps1, record upstream and spec changes with evidence (SYNC.md), and never hand-edit installed artifacts (the profile's dsh.profile.bundles selection, or ~/.dsh/skills/).

                Trigger the ref-* skills at their mandated points: ref-maintain when maintaining this framework; ref-manifest-validate/ref-status for framework self-checks; ref-install to deploy modules into target projects; ref-merge-index for parallel-worker index merging; ref-init to create project skeletons.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs & goals ─────────────────────────────────────────────────

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation (scout/worker/judge/fan-out run isolated via subagent) ────────

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              # DSH 0.2.x removed `backgroundMode` (every delegation is now a managed
              # activation returning { kind: 'activation', subagentId }). Subagents
              # mount THIS preset so they inherit the RE persona and ref_* tools.
              # spawn supports agentPreset; the value MUST also be listed in
              # allowedAgentPresets (tool-subagent/preset-selection.ts:29-30), and the
              # provider must advertise capabilities.agentPreset.
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  agentPreset: re-framework
                  allowedAgentPresets:
                    - re-framework

              # fork does NOT advertise capabilities.agentPreset
              # (subagent-fork-in-process/src/index.ts:63) and inherits the parent
              # composition, so it must NOT carry agentPreset or allowedAgentPresets —
              # setting either throws "independent agent preset".
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              # Optional external-agent providers. Production dsh does NOT install these
              # bundles: install the matching Bundle in this Profile and restart the Host,
              # then remove `disabled` from the row you want. Host availability alone
              # grants no tool. (Kept in parity with the official standard preset.)
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              # Ralph loop (optional; disabled by upstream default — enable per the note above)
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── re-framework toolchain (plugin shipped by this bundle; bare package subpath) ──
          #
          # All five tools are mounted here (config omitted = full set). Tools are NOT
          # mounted globally (user decision 2026-08-15): other sessions run the
          # framework's python scripts directly via pwsh instead.

          - id: re-framework-tools
            name: '@dsh-external/dsh-re-framework/plugin'
            config: {}

          # ── re-framework skills (shipped by this bundle; resolved from the installed package) ──

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-external/dsh-re-framework/package.json')), 'skills')"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
